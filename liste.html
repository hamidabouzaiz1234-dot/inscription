<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172b3a; background: #f3f7f6; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { max-width: 1180px; min-height: 100vh; margin: 0 auto; padding: 58px 28px 72px; background: radial-gradient(circle at 5% 0, #e0f4ed 0, transparent 27%), #f3f7f6; }
    h1 { margin: 0 0 12px; color: #153348; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -.05em; line-height: 1.12; }
    body > p { margin: 0 0 30px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border: 1px solid #cfe4dc; border-radius: 10px; background: #fff; color: #087f68; font-size: .95rem; font-weight: 700; text-decoration: none; box-shadow: 0 3px 12px #183b3208; transition: background .2s, transform .2s; }
    a::before { content: "+"; font-size: 1.2rem; line-height: .8; }
    a:hover { transform: translateY(-1px); background: #eff9f5; }
    a:focus-visible { outline: 3px solid #50bca1; outline-offset: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; }
    .card { overflow: hidden; padding: 10px 10px 18px; border: 1px solid #e2ebe8; border-radius: 18px; background: #fff; text-align: left; box-shadow: 0 10px 30px #183b320b; transition: transform .22s, box-shadow .22s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 18px 38px #183b3217; }
    .card img { display: block; width: 100%; height: 220px; border-radius: 12px; background: #edf3f1; object-fit: cover; }
    .card h3 { margin: 16px 8px 5px; color: #193b4d; font-size: 1.12rem; letter-spacing: -.02em; }
    .card p { margin: 0 8px; color: #71818a; font-size: .94rem; }
    #liste:empty { display: none; }
    #liste:not(:has(.card)) { padding: 24px; border: 1px dashed #c9d9d4; border-radius: 14px; background: #ffffffb8; color: #71818a; }
    @media (max-width: 600px) { body { padding: 38px 18px 52px; } .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; } .card img { height: 190px; } }
  </style>
</head>
<body>
  <h1>Liste des stagiaires</h1>
  <p><a href="index.html">Nouvelle inscription</a></p>
  <div class="grid" id="liste">Chargement...</div>

  <script>
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    fetch('/api/liste.php')
      .then(r => r.json())
      .then(res => {
        const c = document.getElementById('liste');
        if (!res.success || res.data.length === 0) { c.textContent = 'Aucun stagiaire.'; return; }
        c.innerHTML = res.data.map(s => `
          <div class="card">
            <img src="${esc(s.photo)}" alt="Photo de ${esc(s.prenom)}">
            <h3>${esc(s.prenom)} ${esc(s.nom)}</h3>
            <p>${esc(s.ville)}</p>
          </div>`).join('');
      })
      .catch(() => document.getElementById('liste').textContent = 'Erreur de chargement.');
  </script>
</body>
</html>

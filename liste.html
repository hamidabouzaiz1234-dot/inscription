<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Liste des stagiaires</h1>
  <p><a href="index.html">Nouvelle inscription</a></p>
  <div class="grid" id="liste">Chargement...</div>

  <script>
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    fetch('/api/liste.php')
      .then(r => r.json())
      .then(res => {
        const c = document.getElementById('liste');
        if (!res.success || res.data.length === 0) { c.textContent = 'Aucun stagiaire.'; return; }
        c.innerHTML = res.data.map(s => `
          <div class="card">
            <img src="${esc(s.photo)}" alt="Photo de ${esc(s.prenom)}">
            <h3>${esc(s.prenom)} ${esc(s.nom)}</h3>
            <p>${esc(s.ville)}</p>
          </div>`).join('');
      })
      .catch(() => document.getElementById('liste').textContent = 'Erreur de chargement.');
  </script>
</body>
</html>

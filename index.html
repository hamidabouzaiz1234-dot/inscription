<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
    #message { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Inscription stagiaire</h1>
  <form id="form">
    <input type="text" name="nom" placeholder="Nom" required>
    <input type="text" name="prenom" placeholder="Prénom" required>
    <input type="text" name="ville" placeholder="Ville" required>
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit">Inscrire</button>
  </form>
  <p id="message"></p>
  <p><a href="liste.html">Voir la liste</a></p>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = 'Envoi en cours...';
      try {
        const res = await fetch('/api/inscrire.php', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        msg.textContent = data.message;
        if (data.success) e.target.reset();
      } catch (err) {
        msg.textContent = 'Erreur réseau.';
      }
    });
  </script>
</body>
</html>

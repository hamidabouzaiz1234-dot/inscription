<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172b3a; background: #f3f7f6; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 56px 20px; display: grid; place-items: center; background: radial-gradient(circle at 10% 5%, #dff4ed 0, transparent 32%), #f3f7f6; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: 8px; background: linear-gradient(90deg, #0c8b72, #55c5a6); }
    h1 { margin: 8px 0 10px; color: #153348; font-size: clamp(1.8rem, 5vw, 2.35rem); letter-spacing: -.045em; line-height: 1.15; }
    body > h1, body > form, body > #message, body > p { width: min(100%, 510px); }
    body > h1 { margin-top: 0; }
    form { display: grid; gap: 17px; padding: clamp(22px, 5vw, 38px); background: #fff; border: 1px solid #e2ebe8; border-radius: 22px; box-shadow: 0 22px 60px #183b3214; }
    form::before { content: "Complétez vos informations pour rejoindre notre liste de stagiaires."; display: block; margin: 0 0 3px; color: #71818a; font-size: .98rem; line-height: 1.6; }
    input { width: 100%; min-height: 52px; padding: 13px 15px; border: 1px solid #d9e3e0; border-radius: 12px; background: #fbfdfc; color: #172b3a; font: inherit; transition: border-color .2s, box-shadow .2s, background .2s; }
    input::placeholder { color: #91a09f; }
    input:focus { outline: none; border-color: #159778; background: #fff; box-shadow: 0 0 0 4px #1597781c; }
    input[type="file"] { padding: 9px; color: #657774; font-size: .92rem; }
    input[type="file"]::file-selector-button { margin-right: 12px; padding: 9px 13px; border: 0; border-radius: 8px; background: #e8f5f0; color: #14765f; font: inherit; font-weight: 650; cursor: pointer; }
    button { min-height: 52px; margin-top: 3px; border: 0; border-radius: 12px; background: #087f68; color: #fff; font: inherit; font-weight: 700; letter-spacing: .01em; cursor: pointer; box-shadow: 0 8px 18px #087f6830; transition: background .2s, transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-1px); background: #066c59; box-shadow: 0 11px 22px #087f6838; }
    button:focus-visible, a:focus-visible { outline: 3px solid #50bca1; outline-offset: 3px; }
    #message { min-height: 24px; margin: 14px 0 0; color: #36564f; font-size: .95rem; }
    body > p:last-child { margin: 8px 0 0; text-align: center; }
    a { color: #087f68; font-weight: 650; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 520px) { body { padding: 36px 16px; } form { border-radius: 18px; } }
  </style>
</head>
<body>
  <h1>Inscription stagiaire</h1>
  <form id="form">
    <input type="text" name="nom" placeholder="Nom" required>
    <input type="text" name="prenom" placeholder="Prénom" required>
    <input type="text" name="ville" placeholder="Ville" required>
    <input type="file" name="photo" accept="image/*" required>
    <button type="submit">Inscrire</button>
  </form>
  <p id="message"></p>
  <p><a href="liste.html">Voir la liste</a></p>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = 'Envoi en cours...';
      try {
        const res = await fetch('/api/inscrire.php', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        msg.textContent = data.message;
        if (data.success) e.target.reset();
      } catch (err) {
        msg.textContent = 'Erreur réseau.';
      }
    });
  </script>
</body>
</html>
